name: E2E (Playwright)

# Execution Plan §19 — CI/CD Production Gates: the E2E gate.
#
# DEFINED BUT DORMANT: the job runs only when the repository variable
# E2E_ENABLED is set to "true" (Settings → Secrets and variables → Actions →
# Variables). This follows the repo precedent of keeping gates meaningful
# instead of permanently red (see the dependency-audit note in ci.yml): the
# specs sign in with real credentials against a real Supabase (canonical QA
# seed users from supabase/schema/11_seed_reference.sql and
# supabase/schema/12_seed_qa_demo.sql), so this gate needs
# a live local stack — a placeholder backend would fail every run.
#
# Activation checklist (M15 report — project_documents/milestone_reports/
# M15_ci_cd_production_gates_report.md):
#   1. Provision Docker-based local Supabase in CI (done below) and watch
#      one monitored run end green (fix env gaps if any surface).
#   2. Set repository variable E2E_ENABLED=true.
#   3. Add "e2e" to the required status checks of main (Settings → Branches
#      → Branch protection) so a failing E2E run blocks the merge, per §19.
#
# Schema policy: `db reset` alone does NOT apply supabase/schema/*.sql --
# see the "Start local Supabase" step below for why and how it's applied.
# schema_paths in supabase/config.toml stays the canonical source of truth
# (Execution Plan §20 stays under repo coordination); this workflow only
# reads it, same as before -- just via psql now instead of relying on
# `db reset` to do it implicitly, which it never actually did.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    if: vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Authenticate Docker to GHCR
        # setup-cli points Supabase's internal image registry at GHCR on
        # GitHub-hosted runners. Authenticate the Docker client so shared
        # runner egress does not hit GHCR's anonymous pull throttle.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Clean up stale local Supabase state
        working-directory: supabase
        shell: bash
        run: |
          # Hosted runners are normally clean, but this also makes the job
          # safe on a reused/self-hosted runner and after an interrupted run.
          supabase stop --no-backup || true

          # `supabase stop` can miss a partially-created/leftover container
          # after an interrupted `supabase start`. Remove only containers
          # publishing Supabase's fixed database port; on GitHub-hosted
          # runners this is the disposable local stack for this job.
          port_users="$(docker ps -a --filter publish=54322 --format '{{.ID}} {{.Names}} {{.Ports}}')"
          if [ -n "$port_users" ]; then
            echo "Removing stale container(s) publishing port 54322:"
            echo "$port_users"
            docker ps -aq --filter publish=54322 | xargs -r docker rm -f
          fi

          # Fail explicitly if Docker still reports the port as occupied.
          remaining="$(docker ps --filter publish=54322 --format '{{.ID}} {{.Names}} {{.Ports}}')"
          if [ -n "$remaining" ]; then
            echo "Port 54322 is still occupied after stale-container cleanup:"
            echo "$remaining"
            exit 1
          fi

      - name: Start local Supabase (canonical schema + QA seed)
        # `supabase db reset` only re-applies whatever files already exist
        # under supabase/migrations/ (confirmed against Supabase's own CLI
        # docs: "applies all local migrations found in supabase/migrations
        # directory"). It does NOT read schema_paths in config.toml directly
        # -- that's a separate two-step "declarative schema" workflow
        # (`db diff -f <name>` generates a migration file from schema_paths,
        # then `db reset`/`migration up` applies *that*). This repo's
        # supabase/migrations/ contains only a README.md, no generated
        # migration has ever been committed, so `db reset` alone has always
        # been a no-op against our actual schema: every custom table,
        # function, RLS policy, and the QA seed data in
        # schema/11_seed_reference.sql was silently never created. That is
        # the real reason QA logins have failed with "Invalid email or
        # password" no matter what the seed file's content was -- the file
        # was simply never executed, regardless of hashes or Vault.
        #
        # Apply schema_paths directly and deterministically with psql
        # instead of depending on `db diff`'s shadow-database diffing (which
        # has documented ordering/staleness issues) -- every CI run starts
        # from a fresh container, so there's nothing to diff against and no
        # need for incremental migration generation here.
        working-directory: supabase
        run: |
          # Studio, postgres-meta, and the analytics pipeline are not needed
          # by the app/security checks. Excluding them materially reduces the
          # number of image pulls. setup-cli exports
          # SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io, which intentionally
          # selects one registry; unset it here so current CLI versions can
          # use their ECR -> GHCR -> Docker Hub fallback when a shared runner
          # IP is throttled by one registry.
          unset SUPABASE_INTERNAL_IMAGE_REGISTRY
          started=0
          for attempt in 1 2 3; do
            if supabase start --exclude studio,postgres-meta,logflare,vector; then
              started=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Supabase start failed; retrying in ${delay}s (attempt ${attempt}/3)..."
              sleep "$delay"
            fi
          done
          if [ "$started" -ne 1 ]; then
            echo "Supabase failed to start after 3 attempts."
            exit 1
          fi
          supabase db reset
          eval "$(supabase status -o env)"
          for f in \
            schema/01_extensions.sql \
            schema/02_types.sql \
            schema/03_tables.sql \
            schema/04_constraints.sql \
            schema/05_indexes.sql \
            schema/07_functions.sql \
            schema/06_views.sql \
            schema/08_triggers.sql \
            schema/09_rls.sql \
            schema/10_permissions.sql \
            schema/11_seed_reference.sql \
            schema/12_seed_qa_demo.sql \
          ; do
            echo "Applying $f ..."
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

          # PostgREST caches the schema and reloads it only on an explicit
          # notification. `supabase db reset` fires one for the CLI's own
          # apply, but the psql loop above runs afterwards with no
          # notification, so functions created/changed by that apply can
          # stay invisible to PostgREST (404/SQLSTATE 42883 on RPC calls
          # to them -- e.g. search_tenant_students, added 2026-09-25).
          # This is the same closing notification the repo's own deploy
          # scripts (scripts/exec_sql.mjs, scripts/update_db_functions.mjs)
          # always send after applying SQL.
          echo "Reloading PostgREST schema cache ..."
          psql "$DB_URL" -c "NOTIFY pgrst, 'reload schema';"
          sleep 5

          # Provision the LOCAL-ONLY super admin the E2E specs sign in as
          # (settings.spec.ts System Lock flow, auth.spec.ts). The canonical
          # seed no longer plants a super_admin anywhere: HARDENING-2026-09-25
          # removed the seeded top-level credential from
          # schema/11_seed_reference.sql and real deployments bootstrap the
          # first super admin manually (see the commented template there).
          # This throwaway CI stack still needs the account to exercise
          # super-admin-only flows, so it is recreated here with the shared
          # QA bcrypt hash (schema/12_seed_qa_demo.sql, plaintext documented
          # in apps/admin/tests/e2e/auth.setup.ts) and never leaves the
          # container.
          psql "$DB_URL" <<'SQL'
          INSERT INTO auth.users (
            id, instance_id, email, encrypted_password,
            email_confirmed_at, created_at, updated_at,
            role, aud, raw_app_meta_data, raw_user_meta_data,
            is_super_admin, confirmation_token, recovery_token,
            email_change_token_new, email_change
          ) VALUES (
            'aaaaaaaa-0000-0000-0000-000000000001',
            '00000000-0000-0000-0000-000000000000',
            'super_admin@eduzone-test.com',
            '$2b$10$p/1N9e/qZaxxvUi6UGUpMO.7EekV0yLQ/4NLdr8ac3D4cfVy7mPJW',
            now(), now(), now(), 'authenticated', 'authenticated',
            '{"provider":"email","providers":["email"]}', '{}',
            false, '','','',''
          )
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO auth.identities
            (id, user_id, provider, identity_data, created_at, updated_at, provider_id, last_sign_in_at)
          VALUES (
            'aaaaaaaa-0000-0000-0000-000000000001',
            'aaaaaaaa-0000-0000-0000-000000000001', 'email',
            '{"sub":"aaaaaaaa-0000-0000-0000-000000000001","email":"super_admin@eduzone-test.com"}',
            now(), now(), 'super_admin@eduzone-test.com', NULL
          )
          ON CONFLICT (provider, provider_id) DO NOTHING;

          -- Bound to the SYSTEM tenant (00000000-...-0001), exactly like the
          -- bootstrap template in 11_seed_reference.sql; super_admins are
          -- never tenants members of a QA tenant.
          INSERT INTO public.users (id, email, first_name, last_name, primary_role, tenant_id, account_status, token_version, region_id)
          VALUES (
            'aaaaaaaa-0000-0000-0000-000000000001',
            'super_admin@eduzone-test.com', 'Super', 'Admin', 'super_admin',
            '00000000-0000-0000-0000-000000000001', 'active', 1, 'me-south-1'
          )
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO public.user_roles (user_id, role_id, tenant_id)
          SELECT u.id, r.id, u.tenant_id
          FROM public.users u
          JOIN public.roles r
            ON r.name = u.primary_role
           AND r.tenant_id = public.system_tenant_id()
          WHERE u.id = 'aaaaaaaa-0000-0000-0000-000000000001'
          ON CONFLICT DO NOTHING;
          SQL

      - name: Export local Supabase URL and anon key
        working-directory: supabase
        run: supabase status -o env >> "$GITHUB_ENV"

      - name: Export public env for the Next.js app
        # `supabase status -o env` exports API_URL / ANON_KEY (not
        # SUPABASE_URL / SUPABASE_ANON_KEY) — confirmed against the
        # Supabase CLI's own docs and community scripts. The previous
        # names here were always unset, so NEXT_PUBLIC_SUPABASE_URL and
        # NEXT_PUBLIC_SUPABASE_ANON_KEY resolved to empty strings and
        # failed the app's env schema validation during `next build`.
        #
        # `-o env` also wraps each value in literal double quotes
        # (e.g. API_URL="http://127.0.0.1:54321"), and GITHUB_ENV does
        # not strip them — so without stripping, NEXT_PUBLIC_SUPABASE_URL
        # ends up as the literal string `"http://127.0.0.1:54321"`
        # (quotes included), which fails the app's `.url()` schema check
        # during `next build`. Strip the surrounding quotes here.
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL//\"/}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY//\"/}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY//\"/}" >> "$GITHUB_ENV"
          # The Playwright webServer runs `next start` (NODE_ENV=production),
          # so the app's strict production env schema (apps/admin/src/lib/env.ts)
          # requires CRON_SECRET at boot via the instrumentation fail-fast
          # gate -- without it the server never becomes ready and Playwright
          # times out. The stack here is a disposable local Supabase, so a
          # fixed dummy value is safe; it only guards /api/cron/routine's
          # Bearer check.
          echo "CRON_SECRET=e2e-local-cron-secret" >> "$GITHUB_ENV"

      - name: Production build
        run: pnpm --filter @eduzone/admin build

      - name: Security gate (RLS + permissions + privileged RPC matrix)
        # SEC-1 / Phase C: cross-tenant isolation + extend_enrollment matrix
        # run against the freshly-seeded local stack. Any breach exits
        # non-zero and fails this job BEFORE Playwright starts, so the
        # required "e2e" check blocks the merge.
        # All QA seed accounts share one bcrypt hash (11_seed_reference.sql /
        # 12_seed_qa_demo.sql)
        # whose documented plaintext is Admin@12345 (auth.setup.ts, M15).
        working-directory: apps/admin
        run: |
          SUPABASE_TEST_URL="$NEXT_PUBLIC_SUPABASE_URL" \
          SUPABASE_TEST_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
          TEST_TEACHER_EMAIL=teacher@eduzone-test.com \
          TEST_TEACHER_PASSWORD=Admin@12345 \
          TEST_ADMIN_EMAIL=admin@eduzone-test.com \
          TEST_ADMIN_PASSWORD=Admin@12345 \
          NODE_PATH="$PWD/node_modules" node ../../scripts/security/rls-smoke-test.ts
          SUPABASE_TEST_URL="$NEXT_PUBLIC_SUPABASE_URL" \
          SUPABASE_TEST_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
          TEST_TEACHER_EMAIL=teacher@eduzone-test.com \
          TEST_TEACHER_PASSWORD=Admin@12345 \
          TEST_ADMIN_EMAIL=admin@eduzone-test.com \
          TEST_ADMIN_PASSWORD=Admin@12345 \
          NODE_PATH="$PWD/node_modules" node ../../scripts/security/permission-exhaustive-test.ts

      - name: Install Playwright browsers
        run: pnpm --filter @eduzone/admin exec playwright install --with-deps chromium

      - name: Run Playwright (chromium)
        env:
          # Keep the shared setup session separate from auth.spec.ts.
          # auth.spec.ts intentionally signs in as super_admin and the local
          # session trigger invalidates the previous session for that user.
          # Using the tenant admin here prevents the auth tests from logging
          # out every page test while they run in parallel.
          E2E_EMAIL: admin@eduzone-test.com
          E2E_PASSWORD: Admin@12345
        run: pnpm --filter @eduzone/admin exec playwright test --project=chromium

      - name: Stop local Supabase
        if: always()
        working-directory: supabase
        run: supabase stop --no-backup || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin/playwright-report/
          retention-days: 7
