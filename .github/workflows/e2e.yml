name: E2E (Playwright)

# Execution Plan §19 — CI/CD Production Gates: the E2E gate.
#
# DEFINED BUT DORMANT: the job runs only when the repository variable
# E2E_ENABLED is set to "true" (Settings → Secrets and variables → Actions →
# Variables). This follows the repo precedent of keeping gates meaningful
# instead of permanently red (see the dependency-audit note in ci.yml): the
# specs sign in with real credentials against a real Supabase (canonical QA
# seed users from supabase/schema/11_seed_reference.sql), so this gate needs
# a live local stack — a placeholder backend would fail every run.
#
# Activation checklist (M15 report — project_documents/milestone_reports/
# M15_ci_cd_production_gates_report.md):
#   1. Provision Docker-based local Supabase in CI (done below) and watch
#      one monitored run end green (fix env gaps if any surface).
#   2. Set repository variable E2E_ENABLED=true.
#   3. Add "e2e" to the required status checks of main (Settings → Branches
#      → Branch protection) so a failing E2E run blocks the merge, per §19.
#
# Schema policy: `db reset` alone does NOT apply supabase/schema/*.sql --
# see the "Start local Supabase" step below for why and how it's applied.
# schema_paths in supabase/config.toml stays the canonical source of truth
# (Execution Plan §20 stays under repo coordination); this workflow only
# reads it, same as before -- just via psql now instead of relying on
# `db reset` to do it implicitly, which it never actually did.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    if: vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (canonical schema + QA seed)
        # `supabase db reset` only re-applies whatever files already exist
        # under supabase/migrations/ (confirmed against Supabase's own CLI
        # docs: "applies all local migrations found in supabase/migrations
        # directory"). It does NOT read schema_paths in config.toml directly
        # -- that's a separate two-step "declarative schema" workflow
        # (`db diff -f <name>` generates a migration file from schema_paths,
        # then `db reset`/`migration up` applies *that*). This repo's
        # supabase/migrations/ contains only a README.md, no generated
        # migration has ever been committed, so `db reset` alone has always
        # been a no-op against our actual schema: every custom table,
        # function, RLS policy, and the QA seed data in
        # schema/11_seed_reference.sql was silently never created. That is
        # the real reason QA logins have failed with "Invalid email or
        # password" no matter what the seed file's content was -- the file
        # was simply never executed, regardless of hashes or Vault.
        #
        # Apply schema_paths directly and deterministically with psql
        # instead of depending on `db diff`'s shadow-database diffing (which
        # has documented ordering/staleness issues) -- every CI run starts
        # from a fresh container, so there's nothing to diff against and no
        # need for incremental migration generation here.
        working-directory: supabase
        run: |
          supabase start
          supabase db reset
          eval "$(supabase status -o env)"
          for f in \
            schema/01_extensions.sql \
            schema/02_types.sql \
            schema/03_tables.sql \
            schema/04_constraints.sql \
            schema/05_indexes.sql \
            schema/07_functions.sql \
            schema/06_views.sql \
            schema/08_triggers.sql \
            schema/09_rls.sql \
            schema/10_permissions.sql \
            schema/11_seed_reference.sql \
          ; do
            echo "Applying $f ..."
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Export local Supabase URL and anon key
        working-directory: supabase
        run: supabase status -o env >> "$GITHUB_ENV"

      - name: Export public env for the Next.js app
        # `supabase status -o env` exports API_URL / ANON_KEY (not
        # SUPABASE_URL / SUPABASE_ANON_KEY) — confirmed against the
        # Supabase CLI's own docs and community scripts. The previous
        # names here were always unset, so NEXT_PUBLIC_SUPABASE_URL and
        # NEXT_PUBLIC_SUPABASE_ANON_KEY resolved to empty strings and
        # failed the app's env schema validation during `next build`.
        #
        # `-o env` also wraps each value in literal double quotes
        # (e.g. API_URL="http://127.0.0.1:54321"), and GITHUB_ENV does
        # not strip them — so without stripping, NEXT_PUBLIC_SUPABASE_URL
        # ends up as the literal string `"http://127.0.0.1:54321"`
        # (quotes included), which fails the app's `.url()` schema check
        # during `next build`. Strip the surrounding quotes here.
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL//\"/}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY//\"/}" >> "$GITHUB_ENV"

      - name: Production build
        run: pnpm --filter @eduzone/admin build

      - name: Install Playwright browsers
        run: pnpm --filter @eduzone/admin exec playwright install --with-deps chromium

      - name: Run Playwright (chromium)
        run: pnpm --filter @eduzone/admin exec playwright test --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin/playwright-report/
          retention-days: 7
