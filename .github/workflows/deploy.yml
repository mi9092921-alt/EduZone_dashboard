name: Main Branch Checks
on:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Validate direct pushes and merges to main with the SAME gate chain
      # used by the pull-request workflow (ci.yml — Execution Plan §19), so
      # a push to main cannot bypass any production gate.
      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Audit
        # Scoped to production dependencies — same rationale as ci.yml:
        # an unscoped audit walks devDependencies never shipped to
        # production and would stay permanently red regardless of what
        # this repo does.
        run: pnpm audit --prod --audit-level=high

      - name: Architecture Check
        # Same gate as ci.yml: the vitest boundary guards in
        # apps/admin/src/architecture (ESLint enforces the same rules in
        # the Lint step below).
        run: pnpm --filter @eduzone/admin exec vitest run --config vitest.unit.config.ts src/architecture

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test (Vitest)
        run: pnpm turbo test

      - name: Production build
        # Build verification only. These public (non-secret) values are
        # required here to get past eager validation in
        # apps/admin/src/lib/env.ts (see ci.yml for details); falls back to
        # a placeholder so this check remains deterministic when repository
        # variables are not configured.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
        run: pnpm turbo build
# This workflow performs checks only; infrastructure and application releases are managed separately.
