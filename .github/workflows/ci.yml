name: CI
on:
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Audit
        # Scoped to production dependencies: an unscoped `pnpm audit` also
        # walks devDependencies (Storybook, Cypress, ESLint tooling, jsdom)
        # that are never shipped to production. One of those transitive
        # advisories (image-size, pulled in by @storybook/nextjs-vite) has
        # no patched release upstream, which would make an unscoped
        # --audit-level=high gate permanently red regardless of what this
        # repo does. --prod keeps the gate meaningful and enforceable for
        # what is actually deployed.
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Test (Vitest)
        run: pnpm turbo test -- --coverage

      - name: Production build
        # NEXT_PUBLIC_* values are public (browser-bundled), not secrets --
        # they're required at build time because Next.js inlines them into
        # the client bundle and apps/admin/src/lib/env.ts validates them
        # eagerly at module import, which Next's page-data collection
        # triggers for every route. Falls back to a placeholder so this
        # build-verification step stays deterministic even before
        # `vars.NEXT_PUBLIC_SUPABASE_URL` / `vars.NEXT_PUBLIC_SUPABASE_ANON_KEY`
        # are configured as repository variables; prefers the real
        # configured value when present.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
        run: pnpm turbo build

      - name: Supabase DB Lint
        run: supabase db lint
